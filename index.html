<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>塔羅解牌台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 版面：單欄，頂部分頁（速查／牌陣／解牌），夜色為主、羊皮紙為淺色主題 */
:root{
  --bg:#f3ead9; --surface:#fbf6ec; --surface2:#f0e5d0; --ink:#3b3028; --muted:#8c7a60;
  --line:#e2d4b9; --gold:#a9741f; --gold-soft:#e9d7a8; --plum:#6e4b7c; --up:#2f7d57; --rev:#b06a2c;
  --shadow:0 8px 28px rgba(80,55,20,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131f; --surface:#221b2e; --surface2:#2b2238; --ink:#efe6d4; --muted:#a799bd;
  --line:#372f49; --gold:#e3b559; --gold-soft:#5a4a2a; --plum:#bd98d8; --up:#5fc08a; --rev:#e0975a;
  --shadow:0 10px 32px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17131f; --surface:#221b2e; --surface2:#2b2238; --ink:#efe6d4; --muted:#a799bd;
  --line:#372f49; --gold:#e3b559; --gold-soft:#5a4a2a; --plum:#bd98d8; --up:#5fc08a; --rev:#e0975a;
  --shadow:0 10px 32px rgba(0,0,0,.4); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Noto Serif TC',"Songti TC",serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.latin{font-family:'Cinzel',serif;letter-spacing:.14em}
.hero{text-align:center;padding-block:22px 10px}
.hero .star{color:var(--gold);font-size:13px;letter-spacing:.5em}
.hero h1{margin:.1em 0 .05em;font-size:27px;font-weight:700;letter-spacing:.12em}
.hero .sub{font-size:11px;color:var(--muted);text-transform:uppercase}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;gap:4px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;padding:9px 6px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px;box-shadow:var(--shadow)}
label.fld{display:block;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 5px}
input,select,textarea,button{font-family:inherit}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font-size:15px;padding:10px 12px}
textarea{min-height:64px;resize:vertical;line-height:1.5}
.search{position:relative;margin-bottom:12px}
.ref-group{margin:18px 0 6px;font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.18em}
.ref-group .latin{color:var(--muted);font-size:10px;margin-left:8px}
.crow{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;overflow:hidden}
.crow>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 13px;font-weight:600}
.crow>summary::-webkit-details-marker{display:none}
.crow>summary .chev{margin-left:auto;color:var(--gold);transition:transform .2s}
.crow[open]>summary .chev{transform:rotate(90deg)}
.crow .meaning{padding:0 13px 13px;border-top:1px dashed var(--line);margin-top:2px}
.crow .mline{display:flex;gap:9px;padding-top:10px;font-size:14px}
.ori{flex:0 0 auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;height:fit-content;margin-top:2px}
.ori.u{color:#fff;background:var(--up)} .ori.r{color:#fff;background:var(--rev)}
.kw{color:var(--muted);font-size:12.5px}
.spread{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.spread h3{margin:0 0 2px;font-size:16px;font-weight:700}
.spread .cnt{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:.1em}
.spread ol{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink)}
.spread ol li{margin-bottom:3px}
.spread ol li b{color:var(--plum)}
.posrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:9px}
.posrow .plabel{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--plum)}
.oribtn{border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font-size:13px;font-weight:700;padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;min-width:60px}
.oribtn[data-o="rev"]{color:#fff;background:var(--rev);border-color:var(--rev)}
.oribtn[data-o="up"]{color:#fff;background:var(--up);border-color:var(--up)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;font-size:15px;font-weight:700;padding:13px 18px;cursor:pointer}
.btn-go{background:var(--gold);color:#271c08;width:100%;box-shadow:var(--shadow)}
.btn-go:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.row-btns{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.assembled{white-space:pre-wrap;font-size:13.5px;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:4px;color:var(--ink)}
.reading{white-space:pre-wrap;font-size:14.5px;line-height:1.72;margin-top:4px}
.reading:empty{display:none}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.divider{height:1px;background:var(--line);margin:16px 0}
.addmore{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.addmore button{border:1.5px dashed var(--gold);background:transparent;color:var(--gold);font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;cursor:pointer}
.themebtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 14px);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;font-size:12px;padding:5px 11px;cursor:pointer;z-index:12}
.small{font-size:12px;color:var(--muted)}
@media (max-width:420px){.posrow{grid-template-columns:1fr}.oribtn{width:100%}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mchip{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:8px 9px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.mchip.today{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold)}
.mchip.sel{background:var(--surface2);border-color:var(--plum)}
.mchip .md{font-size:12px;color:var(--muted);font-weight:700}
.mchip .mn{font-size:13px;font-weight:600;margin-top:2px;line-height:1.3}
.mchip .mo{font-size:10px;font-weight:700;padding:0 6px;border-radius:999px;display:inline-block;margin-top:5px}
.mchip .mo.u{color:#fff;background:var(--up)} .mchip .mo.r{color:#fff;background:var(--rev)}
.mchip .evt{color:var(--gold);font-size:10px;font-weight:700;margin-top:4px;line-height:1.3}
#monthDetail .dhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
#monthDetail .dhead .dd{font-size:13px;color:var(--muted);font-weight:700}
#monthDetail .dhead .big{font-size:20px;font-weight:700}
#monthDetail .warn{color:var(--rev);font-size:12px;font-weight:700}
#monthDetail .evt2{color:var(--gold);font-weight:700;margin:2px 0 8px}
#monthDetail .worknote{background:var(--surface2);border-left:3px solid var(--plum);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:14px}
#monthDetail .worknote b{color:var(--plum)}
</style>
</head>
<body>
<button class="themebtn" id="themeBtn" title="切換主題">☾ 主題</button>
<div class="wrap">
  <div class="hero">
    <div class="star">✦ ✦ ✦</div>
    <h1>塔羅解牌台</h1>
    <div class="sub latin">Tarot · Reading Desk</div>
  </div>

  <div class="tabs" role="tablist">
    <button data-tab="read" class="on">解牌</button>
    <button data-tab="ref">牌義速查</button>
    <button data-tab="spreads">牌陣</button>
  </div>

  <!-- ===== 解牌 ===== -->
  <section data-panel="read">
    <div class="card">
      <label class="fld" for="q">你的問題</label>
      <textarea id="q" placeholder="例：這份新工作的前兩週會怎麼發展？"></textarea>
      <label class="fld" for="spreadSel" style="margin-top:12px">牌陣</label>
      <select id="spreadSel"></select>
      <div id="customWrap" hidden style="margin-top:8px">
        <label class="fld" for="customN">自訂張數</label>
        <input type="text" id="customN" inputmode="numeric" value="3" style="width:90px">
      </div>
    </div>

    <div class="card">
      <label class="fld">你抽到的牌（自己抽，這裡登記）</label>
      <div id="positions"></div>
      <div class="addmore" id="addMoreWrap" hidden>
        <button id="addPos">＋ 再加一張</button>
        <span class="small">自由牌陣可自行增減</span>
      </div>
    </div>

    <div class="card">
      <label class="fld">整理好的牌面</label>
      <div class="assembled" id="assembled">先選牌陣、登記牌面，這裡會自動整理。</div>
      <div class="row-btns">
        <button class="btn btn-go" id="goBtn">🔮 請 Claude 幫我解析</button>
      </div>
      <div class="row-btns">
        <button class="btn btn-ghost" id="copyBtn">複製整份牌面</button>
        <button class="btn btn-ghost" id="clearBtn">清空重來</button>
      </div>
      <p class="hint" id="goHint"></p>
      <div class="reading" id="reading"></div>
    </div>
  </section>

  <!-- ===== 牌義速查 ===== -->
  <section data-panel="ref" hidden>
    <div class="search">
      <input type="text" id="refSearch" placeholder="搜尋牌名／關鍵字（例：權杖七、金幣、等待）">
    </div>
    <div id="refList"></div>
  </section>

  <!-- ===== 牌陣 ===== -->
  <section data-panel="spreads" hidden>
    <p class="hint" style="margin-bottom:12px">點牌陣可在「解牌」直接套用。各位置含義如下：</p>
    <div id="spreadList"></div>
  </section>
</div>

<script>

/* ---------- 牌義速查 ---------- */
function cardMeaningHtml(c){
  return '<div class="meaning">'+
    '<div class="mline"><span class="ori u">正位</span><div><div class="kw">'+esc(c.uk)+'</div>'+esc(c.u)+'</div></div>'+
    '<div class="mline"><span class="ori r">逆位</span><div><div class="kw">'+esc(c.rk)+'</div>'+esc(c.r)+'</div></div>'+
    '</div>';
}
function renderRef(filter){
  filter=(filter||'').trim();
  var html='';
  GROUPS.forEach(function(g){
    var rows=g.cards.filter(function(c){
      if(!filter)return true;
      var hay=c.n+' '+(c.al||'')+' '+c.uk+' '+c.rk+' '+c.u+' '+c.r+' '+g.zh;
      return hay.indexOf(filter)>=0;
    });
    if(!rows.length)return;
    html+='<div class="ref-group">'+esc(g.zh)+'<span class="latin">'+esc(g.en)+'</span></div>';
    rows.forEach(function(c){
      html+='<details class="crow"><summary><span>'+esc(c.n)+'</span>'+(c.al?'<span class="kw">'+esc(c.al.split(' ')[0])+'…</span>':'')+'<span class="chev">›</span></summary>'+cardMeaningHtml(c)+'</details>';
    });
  });
  $('#refList').innerHTML=html||'<p class="hint">找不到符合的牌，換個關鍵字試試。</p>';
}
$('#refSearch').addEventListener('input',function(){renderRef(this.value);});
renderRef('');

function optionsHtml(selId){
  var h='<option value="">— 選牌 —</option>';
  GROUPS.forEach(function(g){
    h+='<optgroup label="'+esc(g.zh)+'">';
    g.cards.forEach(function(c){h+='<option value="'+c.id+'"'+(c.id===selId?' selected':'')+'>'+esc(c.n)+'</option>';});
    h+='</optgroup>';
  });
  return h;
}
(function(){
  $('#spreadSel').innerHTML=SPREADS.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+(s.pos?'（'+s.pos.length+'）':'')+'</option>';}).join('');
})();
var state={spread:'time3',rows:[]};   // rows: [{card:'', ori:'up', label:''}]
function currentSpread(){return SPREADS.filter(function(s){return s.id===state.spread;})[0];}
function buildRows(){
  var sp=currentSpread();var labels;
  if(sp.pos){labels=sp.pos.slice();}
  else{var n=Math.max(1,Math.min(15,parseInt($('#customN').value||'3',10)||3));labels=[];for(var i=0;i<n;i++)labels.push('第 '+(i+1)+' 張');}
  // 盡量保留已選
  var old=state.rows;state.rows=labels.map(function(l,i){return {label:l,card:old[i]?old[i].card:'',ori:old[i]?old[i].ori:'up'};});
  renderRows();
}
function renderRows(){
  var sp=currentSpread();
  $('#positions').innerHTML=state.rows.map(function(r,i){
    return '<div class="posrow"><div class="plabel">'+(i+1)+'. '+esc(r.label)+'</div>'+
      '<select data-ci="'+i+'">'+optionsHtml(r.card)+'</select>'+
      '<button class="oribtn" data-oi="'+i+'" data-o="'+r.ori+'">'+(r.ori==='rev'?'逆位':'正位')+'</button>'+
      '</div>';
  }).join('');
  $('#addMoreWrap').hidden = !!sp.pos;
  $('#customWrap').hidden = !!sp.pos;
  updateAssembled();
}
function onSpreadChange(){state.spread=$('#spreadSel').value;state.rows=[];buildRows();}
$('#spreadSel').addEventListener('change',onSpreadChange);
$('#customN').addEventListener('input',function(){if(!currentSpread().pos)buildRows();});
$('#positions').addEventListener('change',function(e){var s=e.target.closest('[data-ci]');if(!s)return;state.rows[+s.getAttribute('data-ci')].card=s.value;updateAssembled();saveDraft();});
$('#positions').addEventListener('click',function(e){var b=e.target.closest('[data-oi]');if(!b)return;var i=+b.getAttribute('data-oi');var r=state.rows[i];r.ori=r.ori==='up'?'rev':'up';b.setAttribute('data-o',r.ori);b.textContent=r.ori==='rev'?'逆位':'正位';updateAssembled();saveDraft();});
$('#addPos').onclick=function(){if(currentSpread().pos)return;state.rows.push({label:'第 '+(state.rows.length+1)+' 張',card:'',ori:'up'});renderRows();};

function lineFor(r){
  var c=BYID[r.card];if(!c)return null;
  var up=r.ori!=='rev';
  return {name:c.n,ori:up?'正位':'逆位',kw:up?c.uk:c.rk,mean:up?c.u:c.r};
}
function updateAssembled(){
  var q=$('#q').value.trim();
  var any=state.rows.some(function(r){return r.card;});
  if(!any){$('#assembled').textContent='先選牌陣、登記牌面，這裡會自動整理。';$('#goBtn').disabled=true;return;}
  var txt='';
  if(q)txt+='問題：'+q+'\n牌陣：'+currentSpread().name+'\n\n';
  state.rows.forEach(function(r,i){
    var L=lineFor(r);
    txt+=(i+1)+'. '+r.label+'｜'+(L?L.name+'（'+L.ori+'）':'（未選）')+'\n';
    if(L)txt+='   關鍵字：'+L.kw+'\n   '+L.mean+'\n';
  });
  $('#assembled').textContent=txt.trim();
  $('#goBtn').disabled=false;
}
$('#q').addEventListener('input',function(){updateAssembled();saveDraft();});

function buildPrompt(){
  var q=$('#q').value.trim();
  var sp=currentSpread();
  var lines=state.rows.map(function(r,i){var L=lineFor(r);return (i+1)+'. 位置「'+r.label+'」：'+(L?L.name+'（'+L.ori+'）':'未選牌');}).filter(function(x,i){return state.rows[i].card;});
  var instr='你是一位溫暖、直接、誠實的塔羅占卜師，說繁體中文。請用「組合式」解讀，不要逐張單獨給牌義——把相鄰或同組的牌串成連貫的訊息。依牌陣位置的意義來解，點出最值得注意的牌組，最後給一段整體訊息和一個具體提醒。語氣像真人說話，不要空泛的安慰，也尊重最終決定權在問卜者手上。';
  var body='【問題】'+(q||'（未填，請就牌面本身與位置給出通則解讀）')+'\n【牌陣】'+sp.name+'\n【抽到的牌】\n'+lines.join('\n');
  return instr+'\n\n'+body;
}

$('#goBtn').addEventListener('click',async function(){
  var reading=$('#reading'),hint=$('#goHint');
  $('#goBtn').disabled=true;hint.textContent='';reading.textContent='正在為你串牌面…';
  var sample=null;
  try{sample=await claude.use('sample');}catch(e){}
  if(!sample){
    reading.textContent='';
    hint.innerHTML='這個環境暫時無法連線 Claude 解牌。你可以按「複製整份牌面」，貼到聊天室請我幫你解；上方的牌義速查也能自己對照。';
    $('#goBtn').disabled=false;return;
  }
  try{
    var res=await sample(buildPrompt(),{modelTier:'default',onText:function(o){reading.textContent=o.text;}});
    if(res&&res.text)reading.textContent=res.text;
    hint.textContent='※ 牌面僅供參考，決定權在你手上。';
  }catch(err){
    reading.textContent='';
    if(err&&err.code==='rate_limited')hint.textContent='太頻繁了，稍等一下再試。';
    else if(err&&err.code==='not_granted')hint.textContent='需要你允許這個頁面向 Claude 提問才能解牌。';
    else hint.textContent='解牌時出了點狀況，可改用「複製整份牌面」貼到聊天室請我解。';
  }
  $('#goBtn').disabled=false;
});

$('#copyBtn').addEventListener('click',function(){
  var t=$('#assembled').textContent;var r=$('#reading').textContent;
  var out=t+(r?'\n\n—— 解讀 ——\n'+r:'');
  var btn=this;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(out).then(function(){btn.textContent='已複製 ✓';setTimeout(function(){btn.textContent='複製整份牌面';},1500);}).catch(select);
  }else select();
  function select(){var ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');btn.textContent='已複製 ✓';setTimeout(function(){btn.textContent='複製整份牌面';},1500);}catch(e){}document.body.removeChild(ta);}
});
$('#clearBtn').addEventListener('click',function(){$('#q').value='';state.rows.forEach(function(r){r.card='';r.ori='up';});renderRows();$('#reading').textContent='';$('#goHint').textContent='';saveDraft();});

/* ---------- 草稿（本機暫存，方便重開繼續） ---------- */
function saveDraft(){try{localStorage.setItem('tarotDraft',JSON.stringify({q:$('#q').value,spread:state.spread,rows:state.rows,customN:$('#customN').value}));}catch(e){}}
function loadDraft(){
  var d;try{d=JSON.parse(localStorage.getItem('tarotDraft')||'null');}catch(e){}
  if(d&&d.spread){state.spread=d.spread;$('#spreadSel').value=d.spread;if(d.customN)$('#customN').value=d.customN;
    buildRows();
    if(d.rows&&d.rows.length){state.rows=d.rows.map(function(r,i){return {label:(currentSpread().pos?currentSpread().pos[i]:r.label)||r.label,card:r.card||'',ori:r.ori||'up'};});renderRows();}
    if(d.q)$('#q').value=d.q;
    updateAssembled();
  }else{buildRows();}
}
loadDraft();
</script>
</body>
</html>
